<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenRouter | AnimalVision</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body data-mode="openrouter">
    <main class="container">
      <header class="header">
        <h1>AnimalVision</h1>
        <p>Vision analysis through OpenRouter</p>
        <nav class="page-links" aria-label="Application pages">
          <a class="page-link" href="/">My Model</a>
          <a class="page-link active" href="/openrouter">OpenRouter</a>
          <a class="page-link" href="/debug">Debug</a>
        </nav>
      </header>

      <section class="provider-note">
        <strong>OpenRouter model</strong>
        <span>Uses the configured vision model for a second opinion.</span>
      </section>

      <section class="upload-panel">
        <div id="dropZone" class="drop-zone" tabindex="0" aria-label="Upload image">
          <input id="imageInput" type="file" accept="image/*" hidden />
          <div class="drop-content" id="dropContent">
            <div class="icon">+</div>
            <div class="text-area">
              <strong>Choose an image</strong>
              <span>Click or drag an image</span>
            </div>
          </div>
        </div>
        <div class="image-actions">
          <button id="analyzeBtn" class="primary" type="button">Analyze Image</button>
          <button id="removeBtn" class="ghost" type="button">Remove</button>
        </div>
      </section>

      <div id="messageBox" class="message-box hidden" role="alert"></div>
      <section class="preview-panel hidden" id="previewPanel">
        <img id="previewImage" alt="Selected preview" />
      </section>

      <section class="result-panel">
        <h2>Result</h2>
        <div class="stats-grid">
          <div class="stat-item"><span class="label">Animal</span><strong id="animalName">—</strong></div>
          <div class="stat-item"><span class="label">Confidence</span><strong id="confidenceValue">—</strong></div>
        </div>
        <div class="meter-wrap"><div id="confidenceBar" class="meter-bar"></div></div>
        <div class="predictions-wrap"><h3>Top predictions</h3><ul id="topPredictions" class="predictions-list"></ul></div>
      </section>
    </main>
    <script src="/static/app.js?v=8"></script>
  </body>
</html>
